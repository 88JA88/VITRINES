<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123f39">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/vitrines-192.png">
    <title>Plan de vitrine</title>
    <link rel="stylesheet" href="styles.css?v=5">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">▣</div>
      <div>
        <p class="eyebrow">Inventaire &amp; emplacement</p>
        <h1>Plan de vitrine</h1>
      </div>
      <div class="top-actions">
        <p class="storage-status" id="storage-status" aria-live="polite"></p>
        <button type="button" class="backup-button" id="backup-button">Sauvegarder</button>
        <button type="button" class="restore-button" id="restore-button">Restaurer</button>
        <p class="catalogue-count" id="catalogue-count" aria-live="polite">Chargement du Catalogue…</p>
      </div>
      <input id="restore-input" type="file" accept="application/json,.json" hidden>
    </header>

    <main class="workspace">
      <aside class="catalogue-panel" aria-label="Catalogue">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">Catalogue</p>
            <h2>Objets</h2>
          </div>
          <span class="count-badge" id="count-badge">—</span>
        </div>

        <div class="catalogue-filters" aria-label="Filtrer les objets du catalogue">
          <button type="button" data-catalogue-filter="all" aria-pressed="true">Tous</button>
          <button type="button" data-catalogue-filter="placed" aria-pressed="false">Classés</button>
          <button type="button" data-catalogue-filter="reserve" aria-pressed="false">En réserve</button>
        </div>
        <p class="catalogue-message" id="catalogue-message" hidden></p>
        <div class="object-list" id="object-list" aria-label="Liste des objets"></div>
      </aside>

      <section class="plan-panel" aria-labelledby="plan-title">
        <div class="plan-toolbar">
          <div class="segmented" aria-label="Choisir la vitrine">
            <button type="button" data-cabinet="V1">Vitrine 1</button>
            <button type="button" data-cabinet="V2">Vitrine 2</button>
          </div>
          <div class="shelf-tabs" aria-label="Choisir la surface">
            <button type="button" data-shelf="F">Fond</button>
            <button type="button" data-shelf="E1">E1</button>
            <button type="button" data-shelf="E2">E2</button>
            <button type="button" data-shelf="E3">E3</button>
            <button type="button" data-shelf="E4">E4</button>
          </div>
        </div>
        <div class="plan-heading">
          <div>
            <p class="eyebrow">Vue en plan</p>
            <h2 id="plan-title">V1.E4</h2>
          </div>
          <div class="present-strip" id="present-strip" aria-label="Objets présents sur la surface active"></div>
        </div>
        <p class="selection-summary" id="selection-summary" aria-live="polite">0 zone sélectionnée</p>
        <div class="grid-scroll">
          <div class="grid-shell">
            <div class="column-labels" aria-hidden="true"><span></span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div>
            <div class="shelf-grid" id="shelf-grid" aria-label="Zones de la surface sélectionnée"></div>
          </div>
        </div>
      </section>

      <aside class="selection-panel" aria-labelledby="research-title">
        <section id="research-panel">
          <h2 id="research-title"><label for="research-input">Rechercher un objet</label></h2>
          <input id="research-input" type="search" autocomplete="off" placeholder="Texte à rechercher…">
          <p class="selection-note">Recherche dans les désignations et les particularités.</p>
          <p id="research-count" aria-live="polite"></p>
          <button id="clear-research" type="button">Effacer les critères</button>
          <div id="research-criteria"></div>
        </section>
        <p class="eyebrow" id="object-heading" hidden>Objet sélectionné</p>
        <div id="selection-content" hidden></div>
        <div class="object-actions" hidden>
          <button type="button" class="place-button" id="place-button" disabled>+ Placer</button>
          <button type="button" class="move-button" id="move-button" disabled>↔ Déplacer</button>
          <button type="button" class="remove-button" id="remove-button" disabled>⌑ Retirer</button>
        </div>
      </aside>
    </main>

    <script src="catalogue.js"></script>
    <script src="recherche.js"></script>
    <script src="app.js?v=10"></script>
  </body>
</html>
